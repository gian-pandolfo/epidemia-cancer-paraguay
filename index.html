<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Epidemia: Paraguay contra el cáncer</title>
<meta name="description" content="Juego educativo sobre la epidemiología del cáncer en Paraguay, 2015–2024, con datos reales del Atlas de Mortalidad por Cáncer.">
<meta name="theme-color" content="#0d1514">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f07a5c'/%3E%3Cpath d='M20 44 32 14l12 30M24 35h16' stroke='%231b0d08' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Jogo para celular (em pé): placar no topo, mapa, painel do departamento e botão de fechar o ano fixo embaixo.
   Mesmas cores e fontes da página do mapa do congresso. */
:root {
  --bg: #f3f6f5; --surface: #ffffff; --surface-2: #e8efed; --ink: #10201e; --muted: #4c605d; --line: #d2dedb;
  --accent: #cf4f35; --accent-ink: #ffffff; --accent-soft: rgba(207, 79, 53, .13);
  --cob0: #e7ecea; --cob1: #8fd1c8; --cob2: #3aa99f; --cob3: #1d6b66;
  --reg1: #fde3c8; --reg2: #f6b27a; --reg3: #e2733c; --reg4: #a8401c;
  --cur1: #dcf1e5; --cur2: #96d3b1; --cur3: #46a774; --cur4: #1d6a45;
  --ouro: #a86a12; --ouro-bg: #fff3d6;
  --nv-p: #2f8f5b; --nv-d: #3c6da3; --nv-t: #9a4fb5;
  --map-stroke: #ffffff; --map-label: #10201e; --map-halo: rgba(255, 255, 255, .9);
  --warn: #9a3412; --warn-soft: #fbece4; --ok: #1f7a4d;
  --f-display: "Bricolage Grotesque", "Segoe UI", Roboto, Arial, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
  --r: 14px; --fora: #cfd8d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1514; --surface: #141f1d; --surface-2: #1c2927; --ink: #e3eeeb; --muted: #9cb1ad; --line: #2a403c;
    --accent: #f07a5c; --accent-ink: #1b0d08; --accent-soft: rgba(240, 122, 92, .18);
    --cob0: #26332f; --cob1: #2a6b63; --cob2: #43a698; --cob3: #92dcd0;
    --reg1: #3b2a20; --reg2: #7a4426; --reg3: #c2602f; --reg4: #f39a63; --cur1: #1b3127; --cur2: #2a6a4a; --cur3: #45a574; --cur4: #93dcb5; --ouro: #f2c14e; --ouro-bg: #3a2f12;
    --nv-p: #5cc48a; --nv-d: #6f9bd2; --nv-t: #c48ee0;
    --fora: #050a09; --map-stroke: #0d1514; --map-label: #eef6f4; --map-halo: rgba(0, 0, 0, .75);
    --warn: #f3a37f; --warn-soft: rgba(243, 163, 127, .12); --ok: #6fd3a0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1514; --surface: #141f1d; --surface-2: #1c2927; --ink: #e3eeeb; --muted: #9cb1ad; --line: #2a403c;
  --accent: #f07a5c; --accent-ink: #1b0d08; --accent-soft: rgba(240, 122, 92, .18);
  --cob0: #26332f; --cob1: #2a6b63; --cob2: #43a698; --cob3: #92dcd0;
  --reg1: #3b2a20; --reg2: #7a4426; --reg3: #c2602f; --reg4: #f39a63; --cur1: #1b3127; --cur2: #2a6a4a; --cur3: #45a574; --cur4: #93dcb5; --ouro: #f2c14e; --ouro-bg: #3a2f12;
  --nv-p: #5cc48a; --nv-d: #6f9bd2; --nv-t: #c48ee0;
  --fora: #050a09; --map-stroke: #0d1514; --map-label: #eef6f4; --map-halo: rgba(0, 0, 0, .75);
  --warn: #f3a37f; --warn-soft: rgba(243, 163, 127, .12); --ok: #6fd3a0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--f-body);
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
button, select { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
main { max-width: 640px; margin: 0 auto; }

/* Placar */
.hud {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  max-width: 640px; margin: 0 auto; padding: calc(8px + env(safe-area-inset-top, 0px)) 0 8px; background: var(--bg);
}
.hud .marca { font: 800 1rem var(--f-display); margin-right: auto; line-height: 1.1; }
.hud .marca small { display: block; font: 400 .72rem var(--f-body); color: var(--muted); }
.hud .marca[hidden] + .chip { margin-right: auto; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.dinheiro { color: var(--ink); }
/* O chip da data também é o botão de pausa */
.chip.ano { cursor: pointer; color: var(--ink); }
.chip.ano[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn-ico { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; min-width: 40px; height: 36px; padding: 0 10px; font-weight: 700; cursor: pointer; }

/* Telas */
.cartao { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.inicio { display: grid; gap: 14px; padding-top: 8px; }
.inicio h1 { font-size: clamp(1.9rem, 8vw, 2.6rem); font-weight: 800; line-height: 1.02; }
.inicio .sub { margin: 0; color: var(--muted); }
.passos { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
/* Regras na tela inicial: fechadas; um toque abre */
.regras summary { cursor: pointer; font: 800 1.05rem var(--f-display); list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 28px; }
.regras summary::-webkit-details-marker { display: none; }
.regras summary::after { content: "+"; font: 800 1.4rem/1 var(--f-body); color: var(--accent); }
.regras[open] summary::after { content: "−"; }
.regras[open] summary { margin-bottom: 10px; }
.aviso { margin: 0; font-size: .82rem; color: var(--muted); }
.creditos { display: grid; gap: 6px; font-size: .8rem; color: var(--muted); }
.creditos h2 { font-size: 1.2rem; color: var(--ink); }
.creditos p { margin: 0; }
.creditos b { color: var(--ink); }
.btn { border: 0; border-radius: 999px; padding: 13px 22px; min-height: 50px; font-weight: 800; font-size: 1.05rem; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
.btn.sec { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }

/* Mapa e painel na mesma tela, sem rolar: o painel do departamento ocupa o canto vazio de baixo à esquerda
   (Argentina: abaixo de Boquerón e Presidente Hayes, à esquerda de Asunción e Ñeembucú) e a legenda o de cima à
   direita (Brasil). Medidas em cqw = % da largura da tela do jogo; o desenho do mapa mede 1600 x 1720. */
#tela-jogo { container-type: inline-size; }
.palco { display: grid; grid-template-columns: 46cqw minmax(0, 1fr); grid-template-rows: 77cqw auto auto; margin-top: 4px; }
.mapa-wrap { grid-column: 1 / -1; grid-row: 1 / span 2; align-self: start; position: relative; }
#mapa { display: block; width: 100%; height: auto; touch-action: manipulation; }
.dep { stroke: var(--map-stroke); stroke-width: 3; stroke-linejoin: round; cursor: pointer; transition: fill .35s ease; }
.dep.sel { stroke: var(--accent); stroke-width: 10; }
.dep-marker { stroke-width: 5; }
.lbl { font: 700 44px var(--f-body); fill: var(--map-label); stroke: var(--map-halo); stroke-width: 9px; paint-order: stroke; pointer-events: none; }
.lbl.sel { font-size: 52px; }
.alerta circle { fill: var(--accent); stroke: var(--map-stroke); stroke-width: 5; }
.alerta text { font: 800 46px var(--f-body); fill: var(--accent-ink); text-anchor: middle; pointer-events: none; }
.canto-ne { grid-column: 2; grid-row: 1; justify-self: end; align-self: start; z-index: 2; width: 34cqw; display: grid; gap: 3px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: .88rem; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg.mini { display: grid; grid-template-columns: 1fr 1fr; border-radius: 10px; padding: 2px; }
.seg.mini button { padding: 4px 2px; font-size: .68rem; border-radius: 8px; }
.legenda { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 6px; font-size: .64rem; color: var(--muted); padding: 4px 6px; border-radius: 8px; background: color-mix(in srgb, var(--bg) 80%, transparent); }
.legenda .leg-tit { grid-column: 1 / -1; font-weight: 700; color: var(--ink); line-height: 1.2; white-space: normal; }
.legenda span { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.legenda.q4 { grid-template-columns: repeat(4, auto); justify-content: start; }
.legenda i { width: 12px; height: 9px; border-radius: 3px; border: 1px solid var(--line); display: inline-block; flex: none; }
/* Números do país em tempo real, logo abaixo de Equilíbrio | Taxas: cada um também vira a camada do mapa */
.vivo { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
.vivo button { display: grid; text-align: left; min-width: 0; padding: 2px 5px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; line-height: 1.1; }
.vivo span { font-size: .56rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vivo b { font-size: .76rem; font-variant-numeric: tabular-nums; }
.vivo .v-mort b { color: var(--warn); }
.vivo .v-cura b { color: var(--ok); }
.vivo button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); }
.vivo button[aria-pressed="true"] span, .vivo button[aria-pressed="true"] b { color: var(--bg); }
/* Cada ação faz o departamento piscar e o ícone subir */
.dep.pulso { animation: pulso .8s ease-in-out 2; }
@keyframes pulso { 50% { fill-opacity: .35; stroke: var(--accent); stroke-width: 16; } }
#g-fx text { font-size: 110px; text-anchor: middle; pointer-events: none; animation: sobe 1.5s ease-out forwards; }
@keyframes sobe { 0% { opacity: 0; transform: translateY(30px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-170px); } }
.alerta .pino { font-size: 64px; }

/* Departamento: informações no canto sudoeste, ao lado do mapa; ações logo abaixo do mapa, na largura toda */
.painel-info {
  grid-column: 1; grid-row: 2; align-self: start; z-index: 2; min-width: 0; display: grid; gap: 4px; padding: 7px 8px;
  border: 1px solid var(--line); border-radius: 12px; background: color-mix(in srgb, var(--surface) 94%, transparent); font-size: .68rem; line-height: 1.25;
}
.painel-acoes { grid-column: 1 / -1; grid-row: 3; display: grid; gap: 6px; margin-top: 8px; }
.dep-tit {
  width: 100%; border: 0; color: var(--ink); font: 800 1.02rem var(--f-display); padding: 0 16px 0 0; cursor: pointer; -webkit-appearance: none; appearance: none;
  background: transparent linear-gradient(45deg, transparent 50%, var(--muted) 50%) no-repeat calc(100% - 7px) 55% / 5px 5px,
              transparent linear-gradient(135deg, var(--muted) 50%, transparent 50%) no-repeat calc(100% - 2px) 55% / 5px 5px;
}
.info { margin: 0; color: var(--muted); display: grid; gap: 2px; }
.info b { color: var(--ink); font-variant-numeric: tabular-nums; }
.meta { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
.fila { margin: 0; padding: 5px 6px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-weight: 700; }
.nivel h3 { font: 800 .72rem var(--f-body); display: flex; align-items: center; justify-content: space-between; gap: 4px; margin: 0 0 2px; }
.nivel h3 .barras { display: inline-flex; gap: 2px; }
.nivel h3 .barras i { width: 10px; height: 6px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--line); }
.nivel[data-n="P"] { --nv: var(--nv-p); } .nivel[data-n="D"] { --nv: var(--nv-d); } .nivel[data-n="T"] { --nv: var(--nv-t); } .nivel[data-n="X"] { --nv: var(--nv-d); }
.nivel h3 .barras i.on { background: var(--nv); border-color: var(--nv); }
.acoes { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 5px; }
.acao {
  display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "ico nome" "ico custo"; column-gap: 4px; align-items: center;
  text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px; min-height: 42px; cursor: pointer; min-width: 0;
}
.acao .ico { grid-area: ico; font-size: .95rem; line-height: 1; }
.acao .nome { grid-area: nome; font-weight: 700; font-size: .7rem; line-height: 1.1; }
.acao .custo { grid-area: custo; font-weight: 800; font-size: .7rem; }
.acao.feita { border-color: var(--nv); box-shadow: inset 0 0 0 2px var(--nv); background: color-mix(in srgb, var(--nv) 14%, var(--surface)); }
.acao.feita .custo { color: var(--nv); }
.acao:disabled { opacity: .45; cursor: not-allowed; }
.acao.desfaz .custo::after { content: " ↺"; }
/* 🤝 convênio: botão pequeno no canto da ação; quando ativo, a ação fica tracejada */
.slot { position: relative; display: grid; min-width: 0; }
.conv { position: absolute; right: 4px; bottom: 4px; z-index: 1; min-height: 20px; padding: 0 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); color: var(--ink); font-size: .62rem; font-weight: 800; line-height: 18px; cursor: pointer; }
.conv:disabled { opacity: .45; cursor: not-allowed; }
.acao.conv-on { border: 2px dashed var(--nv); box-shadow: none; }
.info .eq { color: var(--ink); }

/* Barra de baixo */
.barra {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
.barra-in { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.barra .dica { flex: 1 1 auto; min-width: 0; display: grid; gap: 3px; font-size: .8rem; color: var(--muted); line-height: 1.25; }
.barra .btn { flex: none; }

/* Janelas */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(5, 12, 11, .62); display: flex; align-items: flex-end; justify-content: center; padding: 12px; }
.janela { background: var(--surface); color: var(--ink); border-radius: 18px; width: min(600px, 100%); max-height: 100%; overflow: auto; padding: 18px; display: grid; gap: 12px; margin-bottom: env(safe-area-inset-bottom, 0px); }
.janela .ano { font: 800 .8rem var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.janela h2 { font-size: 1.4rem; font-weight: 800; }
.janela p { margin: 0; }
.efeito { padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); font-weight: 700; }
.fonte { font-size: .76rem; color: var(--muted); }
.imprevisto { display: grid; gap: 8px; padding: 12px; border: 2px dashed var(--line); border-radius: 14px; }
.imprevisto h3 { font-size: 1.1rem; }
.opcoes { display: grid; gap: 8px; }
.opcoes button { display: grid; gap: 2px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); font-weight: 700; cursor: pointer; }
.opcoes small { font-weight: 400; font-size: .8rem; color: var(--muted); }
.opcoes button:disabled { opacity: .5; cursor: not-allowed; }
.licao { border-left: 4px solid var(--nv-d); padding: 6px 10px; background: var(--surface-2); border-radius: 0 10px 10px 0; }
.linhas { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.placar { font: 800 clamp(2.6rem, 12vw, 3.6rem) var(--f-display); line-height: 1; font-variant-numeric: tabular-nums; }
.fontes { margin: 0; padding-left: 18px; font-size: .78rem; color: var(--muted); display: grid; gap: 4px; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: .9rem; max-width: 92vw; text-align: center; }
/* v3: missão no rodapé, faixa de prêmio, confete, +pontos, estrelas, missões, conquistas e desafio relâmpago */
.missao-mini { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 6px; width: 100%; padding: 4px 8px 5px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); text-align: left; cursor: pointer; }
.missao-mini .m-tit { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; font-size: .74rem; color: var(--ink); }
.missao-mini .m-n { font-weight: 800; font-size: .72rem; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.missao-mini .m-barra { grid-column: 1 / -1; display: block; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.missao-mini .m-barra i { display: block; height: 100%; border-radius: 4px; background: var(--ouro); transition: width .5s ease; }
#dica-txt { font-variant-numeric: tabular-nums; }
.faixa { position: fixed; left: 50%; top: calc(54px + env(safe-area-inset-top, 0px)); z-index: 70; display: flex; gap: 10px; align-items: center; width: min(370px, calc(100% - 24px)); padding: 10px 14px; border-radius: 16px; background: var(--surface); border: 2px solid var(--accent); box-shadow: 0 12px 30px rgba(0, 0, 0, .35); transform: translate(-50%, -170%); transition: transform .4s cubic-bezier(.2, 1.3, .4, 1); pointer-events: none; }
.faixa.on { transform: translate(-50%, 0); }
.faixa.ouro { border-color: var(--ouro); background: var(--ouro-bg); }
.faixa .ico { font-size: 1.9rem; line-height: 1; }
.faixa b { display: block; font: 800 .98rem/1.2 var(--f-display); }
.faixa small { display: block; color: var(--muted); font-size: .8rem; }
.confete { position: fixed; z-index: 69; width: 7px; height: 11px; border-radius: 2px; pointer-events: none; animation: confete 1.4s cubic-bezier(.15, .7, .35, 1) forwards; }
@keyframes confete { from { transform: translate(-50%, -50%) rotate(0); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)); opacity: 0; } }
.mais { position: absolute; z-index: 11; font: 800 .8rem var(--f-body); color: var(--ok); pointer-events: none; white-space: nowrap; animation: mais 1.2s ease-out forwards; }
@keyframes mais { from { opacity: 0; transform: translate(-50%, -4px); } 25% { opacity: 1; } to { opacity: 0; transform: translate(-50%, 16px); } }
#g-fx text.sobe-nivel { font: 800 74px var(--f-display); fill: var(--ouro); stroke: var(--map-halo); stroke-width: 12px; paint-order: stroke; }
.alerta .alvo { font-size: 60px; }
.topo-res { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.estrelas { display: inline-flex; gap: 2px; font-size: 1.7rem; line-height: 1; }
.estrelas span { color: var(--line); }
.estrelas span.on { color: var(--ouro); animation: estrela .5s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes estrela { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(0); } }
.metricas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.met { display: grid; justify-items: center; align-content: start; gap: 1px; padding: 8px 4px; border-radius: 12px; background: var(--surface-2); text-align: center; }
.met span { font-size: 1.2rem; line-height: 1.2; }
.met b { font: 800 1.08rem var(--f-display); font-variant-numeric: tabular-nums; }
.met small { font-size: .68rem; line-height: 1.15; color: var(--muted); }
.met.ok b { color: var(--ok); }
.missao { display: grid; gap: 5px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); }
.missao b { font: 800 1rem var(--f-display); }
.missao p { margin: 0; font-size: .86rem; }
.prog { height: 8px; border-radius: 6px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: 6px; background: var(--ouro); }
.janela h3 { font-size: 1.05rem; margin-top: 4px; }
.feitas { color: var(--ok); list-style: none; padding-left: 0; }
.logros { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
.selo { display: grid; justify-items: center; gap: 2px; padding: 8px 4px; border-radius: 12px; background: var(--surface-2); text-align: center; opacity: .55; }
.selo.on { opacity: 1; background: var(--ouro-bg); box-shadow: inset 0 0 0 2px var(--ouro); }
.selo.novo { animation: estrela .6s cubic-bezier(.2, 1.6, .4, 1) both; }
.selo span { font-size: 1.5rem; line-height: 1.2; }
.selo small { font-size: .66rem; line-height: 1.15; }
.quiz-frase { font-size: 1.1rem; font-weight: 700; }
.quiz-op { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.quiz-res { padding: 10px 12px; border-radius: 12px; }
.quiz-res.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
.quiz-res.erro { background: var(--warn-soft); }
.cargo { margin: 6px 0 2px; font: 800 1.15rem var(--f-display); color: var(--accent); }
.trofeus { margin: 0; }
.cons { border-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .confete, .mais { display: none; } .faixa { transition: none; } .estrelas span.on, .selo.novo { animation: none; } }
/* Formulário do ranking */
.form-rank { display: grid; gap: 10px; }
.form-rank label { display: grid; gap: 4px; font-weight: 700; font-size: .9rem; }
.form-rank input[type="text"] { font: inherit; font-weight: 400; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.form-rank input[type="text"]:focus { outline: none; border-color: var(--accent); }
.form-rank .consent { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; font-size: .84rem; color: var(--muted); }
.form-rank .consent input { width: 22px; height: 22px; flex: none; margin-top: 2px; accent-color: var(--accent); }
.msg-rank { margin: 0; font-weight: 700; }
.msg-rank.ok { color: var(--ok); }
.msg-rank.erro { color: var(--warn); }
a.btn { display: inline-flex; align-items: center; text-decoration: none; }
/* Celulares estreitos: placar numa linha só */
/* Tela larga (painel do Claude, computador, tablet): o jogo fica numa moldura do tamanho de um celular (390 x 844).
   A moldura vira o "viewport" dos elementos fixos (barra, janelas, aviso) com o transform; quem rola é a .tela. */
@media (min-width: 520px) {
  html { background: var(--fora); }
  body { min-height: 100vh; padding: 16px; display: grid; place-items: center; background: var(--fora); }
  .aparelho {
    position: relative; width: 410px; height: min(864px, calc(100vh - 32px)); border: 10px solid #000; border-radius: 34px;
    overflow: hidden; transform: translateZ(0); background: var(--bg); box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
  }
  .tela { height: 100%; overflow-y: auto; padding: 0 12px 96px; overscroll-behavior: contain; }
  .hud { padding-top: 8px; }
  .hud { gap: 5px; }
  .chip { padding: 4px 8px; font-size: .9rem; }
  .btn-ico { min-width: 34px; height: 34px; padding: 0 8px; }
}
@media (max-width: 400px) {
  .hud { gap: 5px; }
  .chip { padding: 4px 8px; font-size: .9rem; }
  .btn-ico { min-width: 34px; height: 34px; padding: 0 8px; }
  .acao { min-height: 40px; padding: 5px; }
  .painel-acoes { gap: 5px; margin-top: 6px; }
  .barra .btn { padding: 10px 16px; min-height: 46px; font-size: 1rem; }
}
@media (max-width: 370px) {
  .hud { gap: 4px; }
  .chip { padding: 3px 6px; font-size: .84rem; }
  .btn-ico { min-width: 30px; height: 32px; padding: 0 6px; }
  .painel-info { font-size: .64rem; }
  .legenda { font-size: .58rem; }
  .barra .dica { font-size: .74rem; }
  .barra .btn { padding: 9px 12px; font-size: .92rem; }
}
@media (prefers-reduced-motion: reduce) { .dep { transition: none; } .dep.pulso { animation: none; } #g-fx text { display: none; } }
</style>
</head>
<body>
<div class="aparelho"><div class="tela" id="tela">
<header class="hud">
  <div class="marca"><span id="h-titulo">Epidemia</span><small id="h-sub">Paraguay contra el cáncer</small></div>
  <button class="chip ano" id="h-ano" type="button" hidden></button>
  <span class="chip dinheiro" id="h-dinheiro" hidden></span>
  <span class="chip" id="h-pontos" hidden></span>
  <button class="btn-ico" id="btn-ajuda" type="button" aria-label="Ayuda">?</button>
  <button class="btn-ico" id="btn-idioma" type="button">PT</button>
</header>

<main>
  <section id="tela-inicio" class="inicio"></section>
  <section id="tela-jogo" hidden>
    <div class="palco">
      <div class="mapa-wrap" id="mapa-wrap"></div>
      <div class="canto-ne">
        <div class="seg mini" role="group" id="modos">
          <button type="button" data-modo="cob" aria-pressed="true"></button>
          <button type="button" data-modo="reg" aria-pressed="false"></button>
        </div>
        <div class="vivo" id="vivo" role="group"></div>
        <div class="legenda" id="legenda"></div>
      </div>
      <div id="painel-info" class="painel-info"></div>
      <div id="painel" class="painel-acoes"></div>
    </div>
  </section>
  <section id="tela-fim" class="inicio" hidden></section>
</main>
</div>

<footer class="barra" id="barra" hidden>
  <div class="barra-in">
    <div class="dica" id="dica"><button class="missao-mini" id="btn-missoes" type="button"></button><span id="dica-txt"></span></div>
    <button class="btn" id="btn-fechar" type="button"></button>
  </div>
</footer>

<div id="modal" class="overlay" hidden><div class="janela" id="janela" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="faixa" class="faixa" role="status" aria-live="polite" hidden></div>
</div>

<script src="config.js"></script>
<script src="dados.js"></script>
<script src="jogo.js"></script>
</body>
</html>
